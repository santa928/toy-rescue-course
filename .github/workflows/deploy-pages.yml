name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build -- --base=/toy-rescue-course/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.0

      # deploy-pages sets page_url immediately after Pages accepts the request.
      # An accepted deployment that later fails must retain its failure status.
      - name: Check whether Pages accepted the deployment
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ -n "$PAGE_URL" ]]; then
            echo "::error::Pages accepted the deployment but did not finish publishing it."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url, build_type, source}' ||
            echo "::warning::Could not read Pages settings for diagnostics."
          echo "::notice::Pages did not return a deployment URL. Retrying the same artifact in two minutes."
          sleep 120

      - name: Retry deployment of the existing artifact
        if: success() && steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v5.0.0
