services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5180:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    environment:
      VEHICLE_LAB_BASE_URL: http://127.0.0.1:5173
    volumes:
      - ./output:/app/output
    command:
      - sh
      - -lc
      - |
        npm run dev -- --host 127.0.0.1 > /tmp/vehicle-lab-vite.log 2>&1 &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT
        node scripts/verify-vehicle-lab.mjs || {
          cat /tmp/vehicle-lab-vite.log >&2
          exit 1
        }

volumes:
  node_modules:
