services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5180:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    depends_on:
      - web
    environment:
      VEHICLE_LAB_BASE_URL: http://web:5173
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    command: node scripts/verify-vehicle-lab.mjs

volumes:
  node_modules:
  e2e_node_modules:
